name: Sync BI team directory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    paths:
      - 'scripts/sync-bi-teams.mjs'
      - '.github/workflows/sync-bi-teams.yml'

permissions:
  contents: write

concurrency:
  group: sync-bi-team-directory
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install BI sync browser dependency
        run: npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.22.3

      - name: Discover and render BI team directory
        run: node scripts/sync-bi-teams.mjs

      - name: Commit updated BI source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/biTeamUrls.json src/data/biTeamsRaw.json
          if git diff --cached --quiet; then
            echo "BI team URL snapshot is unchanged."
            exit 0
          fi
          git commit -m "data: refresh BI team source snapshot"
          git push
