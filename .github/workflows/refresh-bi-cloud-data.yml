name: Refresh BI live team collection

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-bi-cloud-data.mjs"
      - ".github/workflows/refresh-bi-cloud-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save puppeteer-core@24
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Pull live BI team collection
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/sync-bi-cloud-data.mjs
      - name: Commit BI collection snapshot
        run: |
          git config user.name "buhurtos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/biTeamCollection.json
          if git diff --cached --quiet; then
            echo "No BI collection changes"
            exit 0
          fi
          git commit -m "Refresh BI live team collection"
          git push
