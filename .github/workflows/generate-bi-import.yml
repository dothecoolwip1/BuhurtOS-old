name: Generate BI Supabase import

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-bi-import.mjs"
      - "src/data/biTeamCollection.json"
      - ".github/workflows/generate-bi-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate SQL chunks
        run: node scripts/generate-bi-import.mjs
      - name: Commit generated import
        run: |
          git config user.name "buhurtos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/generated/bi-live-import
          if git diff --cached --quiet; then
            echo "No generated import changes"
            exit 0
          fi
          git commit -m "Generate BI live import"
          git push
