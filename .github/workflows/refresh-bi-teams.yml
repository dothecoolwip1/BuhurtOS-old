name: Refresh BI team source snapshot

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-bi-teams.mjs"
      - ".github/workflows/refresh-bi-teams.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bi-teams
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install crawler dependency
        run: npm install --no-save puppeteer-core@24

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Crawl BI directory and profiles
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          BI_PROFILE_CONCURRENCY: 5
        run: node scripts/sync-bi-teams.mjs

      - name: Commit refreshed source snapshot
        run: |
          git config user.name "buhurtos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/biTeamUrls.json src/data/biTeamsRaw.json src/data/biTeamProfilesRaw.json
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Refresh BI team source snapshot"
          git push
